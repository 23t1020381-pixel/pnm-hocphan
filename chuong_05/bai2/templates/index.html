<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>
    <!-- Phông chữ Inter hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f5f9;
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        label span.weight {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: #0f172a;
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.25);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Thẻ hiển thị kết quả */
        .result-box {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Kết quả thành công */
        .result-box.success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        /* Kết quả lỗi */
        .result-box.error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h2>Tính Điểm Học Phần</h2>
            <p>Nhập điểm các thành phần để xét kết quả</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="cc">
                    Chuyên cần
                    <span class="weight">10%</span>
                </label>
                <input type="text" id="cc" name="cc" value="{{ cc }}" placeholder="Nhập điểm từ 0 - 10">
            </div>

            <div class="form-group">
                <label for="gk">
                    Giữa kỳ
                    <span class="weight">30%</span>
                </label>
                <input type="text" id="gk" name="gk" value="{{ gk }}" placeholder="Nhập điểm từ 0 - 10">
            </div>

            <div class="form-group">
                <label for="ck">
                    Cuối kỳ
                    <span class="weight">60%</span>
                </label>
                <input type="text" id="ck" name="ck" value="{{ ck }}" placeholder="Nhập điểm từ 0 - 10">
            </div>

            <button type="submit">Tính điểm</button>
        </form>

        {% if thong_bao %}
            <div class="result-box {% if 'Lỗi' in thong_bao or 'Trống' in thong_bao %}error{% else %}success{% endif %}">
                Mong đợi: {{ thong_bao }}
            </div>
        {% endif %}
    </div>
</body>
</html>
