{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<section class="card login-card">
    <h1>Đăng nhập</h1>
    <p class="subtitle">Vui lòng nhập thông tin tài khoản của bạn.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username }}"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
            >
        </div>

        <label class="remember">
            <input
                type="checkbox"
                name="remember"
                {% if remember %}checked{% endif %}
            >
            Ghi nhớ đăng nhập
        </label>

        <button type="submit" class="primary-button">
            Đăng nhập
        </button>
    </form>

    <div class="demo-account">
        <strong>Tài khoản thử nghiệm</strong>
        <p>Username: <code>Phát</code></p>
        <p>Password: <code>Phat123456</code></p>
    </div>
</section>
{% endblock %}
