{% extends "base.html" %}

{% block title %}Hồ sơ cá nhân{% endblock %}

{% block content %}
<section class="card profile-card">
    <div class="avatar">{{ username[0]|upper }}</div>

    <h1>Hồ sơ cá nhân</h1>
    <p>Xin chào, <strong>{{ username }}</strong>!</p>
    <p>Trạng thái: <span class="status">Đã đăng nhập</span></p>

    <a class="primary-button link-button"
       href="{{ url_for('index') }}">
        Về trang chủ
    </a>
</section>
{% endblock %}
