<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Dự đoán filter</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><h1>Dự đoán kết quả filter Jinja2</h1><p>Quan sát biểu thức, dự đoán đầu ra rồi đối chiếu cột kết quả.</p><table class="table table-bordered"><thead><tr><th>Biểu thức</th><th>Kết quả</th></tr></thead><tbody>{% for expression, result in examples %}<tr><td><code>{{ expression }}</code></td><td>{{ result }}</td></tr>{% endfor %}</tbody></table></body></html>
