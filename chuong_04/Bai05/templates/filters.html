<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Filter tùy biến</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><h1>Filter tùy biến</h1><table class="table table-striped"><thead><tr><th>Sản phẩm</th><th>Giá</th><th>Ngày nhập</th><th>Mô tả rút gọn</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.name }}</td><td>{{ item.price|vnd }}</td><td>{{ item.date|date_vi }}</td><td>{{ item.description|short_text(32) }}</td></tr>{% endfor %}</tbody></table></body></html>
