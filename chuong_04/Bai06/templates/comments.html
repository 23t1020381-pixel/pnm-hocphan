<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bình luận an toàn</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><h1>Bình luận</h1><form method="post" class="card card-body mb-4"><label class="form-label">Tên</label><input name="name" class="form-control mb-2" maxlength="60"><label class="form-label">Nội dung</label><textarea name="content" class="form-control mb-2" maxlength="500" required></textarea><button class="btn btn-primary">Gửi bình luận</button></form>{% for c in comments %}<article class="border rounded p-3 mb-2"><strong>{{ c.name }}</strong><p class="mb-0">{{ c.content }}</p></article>{% endfor %}<p class="text-muted">Nội dung được Jinja2 autoescape, không dùng filter safe.</p></body></html>
