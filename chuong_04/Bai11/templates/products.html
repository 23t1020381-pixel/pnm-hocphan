<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="container py-4"><div class="d-flex justify-content-between"><h1>Sản phẩm</h1><span class="badge text-bg-success align-self-center">Giỏ hàng: {{ cart_count }}</span></div><div class="row g-3">{% for p in products %}<div class="col-12 col-sm-6 col-lg-3"><div class="card h-100 product-card"><div class="product-art">{{ p.name[0] }}</div><div class="card-body d-flex flex-column"><h2 class="h5">{{ p.name }}</h2><p class="text-muted">{{ p.category }}</p><strong class="mb-3">{{ "{:,.0f}".format(p.price).replace(",", ".") }} đ</strong><form method="post" action="{{ url_for('add',product_id=p.id) }}" class="mt-auto"><button class="btn btn-primary w-100">Thêm vào giỏ</button></form></div></div></div>{% endfor %}</div></body></html>
