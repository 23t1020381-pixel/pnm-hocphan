<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng điểm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><h1>Bảng điểm sinh viên</h1><table class="table table-striped table-bordered"><thead class="table-dark"><tr><th>STT</th><th>Mã SV</th><th>Họ tên</th><th>Điểm</th><th>Xếp loại</th></tr></thead><tbody>{% for s in students %}<tr><td>{{ loop.index }}</td><td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ "%.1f"|format(s.score) }}</td><td>{% if s.score >= 8 %}Giỏi{% elif s.score >= 6.5 %}Khá{% elif s.score >= 5 %}Trung bình{% else %}Không đạt{% endif %}</td></tr>{% else %}<tr><td colspan="5">Chưa có sinh viên</td></tr>{% endfor %}</tbody></table></body></html>
