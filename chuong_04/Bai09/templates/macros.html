{% macro pagination(page, total_pages, endpoint) -%}
<nav aria-label="Phân trang"><ul class="pagination">
<li class="page-item {% if page <= 1 %}disabled{% endif %}"><a class="page-link" href="{{ url_for(endpoint, page=page-1) }}">Trước</a></li>
{% for p in range(1,total_pages+1) %}<li class="page-item {% if p==page %}active{% endif %}"><a class="page-link" href="{{ url_for(endpoint, page=p) }}">{{ p }}</a></li>{% endfor %}
<li class="page-item {% if page >= total_pages %}disabled{% endif %}"><a class="page-link" href="{{ url_for(endpoint, page=page+1) }}">Sau</a></li>
</ul></nav>
{%- endmacro %}
